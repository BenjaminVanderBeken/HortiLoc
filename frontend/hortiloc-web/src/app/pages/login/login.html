<section>
  <h1>Connexion HortiLoc</h1>

  <form
    [formGroup]="formulaire"
    (ngSubmit)="connecter()"
  >
    <div>
      <label for="email">Adresse e-mail</label>

      <input
        id="email"
        type="email"
        formControlName="email"
      >
    </div>

    <div>
      <label for="motDePasse">Mot de passe</label>

      <input
        id="motDePasse"
        type="password"
        formControlName="motDePasse"
      >
    </div>

    <button type="submit">
      Se connecter
    </button>
  </form>

  @if (authService.erreur()) {
    <p>{{ authService.erreur() }}</p>
  }
</section>
